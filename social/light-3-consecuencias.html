  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#EDE8DD;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .stage{width:100%;max-width:520px;aspect-ratio:1080/1350;position:relative}
  svg{width:100%;height:100%;display:block;border-radius:14px;overflow:hidden}

  @keyframes popIn{0%{opacity:0;transform:translateY(20px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes fadeOut{to{opacity:0}}
  @keyframes drawCrack{to{stroke-dashoffset:0}}
  @keyframes drawLine{to{stroke-dashoffset:0}}
  @keyframes dripGrow{0%{transform:scaleY(0);opacity:0}30%{opacity:1}100%{transform:scaleY(1);opacity:.9}}
  @keyframes dropFall{0%{opacity:0;transform:translateY(-6px)}20%{opacity:1}100%{opacity:0;transform:translateY(30px)}}
  @keyframes iconPulse{0%{opacity:0;transform:scale(.7)}55%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes radarPulse{0%{r:28;opacity:.8;stroke-width:3}100%{r:110;opacity:0;stroke-width:.5}}
  @keyframes ripple{0%{r:8;opacity:.7}100%{r:44;opacity:0}}
  @keyframes drawCheck{to{stroke-dashoffset:0}}
  @keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes wipeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

  .ring{ animation:radarPulse 2.2s ease-out infinite; transform-origin:center; transform-box:fill-box; }
  .ripple-el{ animation:ripple 2s ease-out infinite; transform-origin:center; transform-box:fill-box; }
  .bar{ transform-origin:bottom; transform-box:fill-box; }
</style>
